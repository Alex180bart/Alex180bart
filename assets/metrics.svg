="26" y="132" class="sans" font-size="15" fill="#C3CBDB">duração de uma tarefa depois de automatizada</text><text x="290" y="32" class="mono" font-size="11" fill="#8B97B0">antes · 8h</text><rect x="290" y="40" width="172" height="9" rx="4.5" fill="#FF6D5A" fill-opacity=".85"/><text x="290" y="70" class="mono" font-size="11" fill="#8B97B0">depois · 12min</text><rect x="290" y="78" width="172" height="9" rx="4.5" fill="#080D1A"/><rect class="bar shrink" x="290" y="78" width="172" height="9" rx="4.5" fill="#22D3EE"/></g><g transform="translate(0,170)"><clipPath id="m2clip"><rect width="490" height="160" rx="16"/></clipPath><g clip-path="url(#m2clip)"><rect width="490" height="160" fill="#0B1020"/><rect width="490" height="160" fill="url(#mdots)"/></g><rect x="0.5" y="0.5" width="489" height="159" rx="16" stroke="#1E2A47"/><text x="26" y="36" class="mono" font-size="12" fill="#8B97B0">// custo evitado</text><text x="24" y="88" class="sans b" font-size="40" letter-spacing="-1" fill="url(#numGrad)">R$ 1 mi</text><text x="26" y="132" class="sans" font-size="15" fill="#C3CBDB">em Salesforce substituído por um CRM próprio (Nexa)</text><text x="290" y="44" class="mono" font-size="12" fill="#8B97B0">Salesforce · R$ 1.000.000</text><rect class="bar strike" x="288" y="39" width="184" height="2" fill="#FF6D5A"/><g class="fade"><text x="290" y="78" class="mono" font-size="12" fill="#34D399">→ Nexa CRM · feito em casa</text></g></g><g transform="translate(510,170)"><clipPath id="m3clip"><rect width="490" height="160" rx="16"/></clipPath><g clip-path="url(#m3clip)"><rect width="490" height="160" fill="#0B1020"/><rect width="490" height="160" fill="url(#mdots)"/></g><rect x="0.5" y="0.5" width="489" height="159" rx="16" stroke="#1E2A47"/><text x="26" y="36" class="mono" font-size="12" fill="#8B97B0">// experiência</text><text x="24" y="88" class="sans b" font-size="40" letter-spacing="-1" fill="url(#numGrad)">10+ anos</text><text x="26" y="132" class="sans" font-size="15" fill="#C3CBDB">entre tecnologia, marketing, CRM e automação</text><line x1="295" y1="50" x2="457.0" y2="50" stroke="#3A4766" stroke-width="2"/><circle class="lit" style="animation-delay:0.0s;animation-duration:6s" cx="295.0" cy="50" r="7" fill="#22D3EE"/><text x="295.0" y="80" text-anchor="middle" class="mono" font-size="11" fill="#8B97B0">tec</text><circle class="lit" style="animation-delay:0.5s;animation-duration:6s" cx="349.0" cy="50" r="7" fill="#A78BFA"/><text x="349.0" y="80" text-anchor="middle" class="mono" font-size="11" fill="#8B97B0">mkt</text><circle class="lit" style="animation-delay:1.0s;animation-duration:6s" cx="403.0" cy="50" r="7" fill="#FBBF24"/><text x="403.0" y="80" text-anchor="middle" class="mono" font-size="11" fill="#8B97B0">CRM</text><circle class="lit" style="animation-delay:1.5s;animation-duration:6s" cx="457.0" cy="50" r="7" fill="#34D399"/><text x="457.0" y="80" text-anchor="middle" class="mono" font-size="11" fill="#8B97B0">auto</text></g></svg>