<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none" role="img" aria-label="Resultados: 52 horas por semana liberadas, tarefa de 8 horas reduzida a 12 minutos, R$ 1 milhão em Salesforce substituído pelo Nexa CRM, mais de 10 anos de experiência"><title>Resultados: 52 horas por semana liberadas, tarefa de 8 horas reduzida a 12 minutos, R$ 1 milhão em Salesforce substituído pelo Nexa CRM, mais de 10 anos de experiência</title><style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.b{font-weight:700}
.sb{font-weight:600}

@keyframes grow{0%{transform:scaleX(0)}18%,88%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:.0}}
@keyframes shrink{0%,15%{transform:scaleX(1)}45%,90%{transform:scaleX(.03)}100%{transform:scaleX(1)}}
@keyframes strike{0%,10%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
@keyframes fadein{0%,35%{opacity:0;transform:translateX(-8px)}50%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}
@keyframes lit{0%,8%{opacity:.25}12%,100%{opacity:1}}
@keyframes litdot{0%,8%{fill:#121B33}12%,100%{fill:currentColor}}
@keyframes cyc{0%{opacity:1}100%{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left center}
.grow{animation:grow 6s ease-out infinite}
.shrink{animation:shrink 6s ease-in-out infinite}
.strike{animation:strike 6s ease-in-out infinite}
.fade{opacity:0;animation:fadein 6s ease-out infinite}
.lit{animation:lit 6s linear infinite}
</style><defs>
<pattern id="mdots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="1.2" fill="#1A2440"/>
</pattern>
<radialGradient id="mglowV" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#A78BFA" stop-opacity="0.22"/>
  <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</radialGradient>
<radialGradient id="mglowC" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
  <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</radialGradient>
<linearGradient id="mgrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE"/>
  <stop offset="1" stop-color="#A78BFA"/>
</linearGradient>
<linearGradient id="numGrad" x1="0" y1="0" x2="1" y2="0">
