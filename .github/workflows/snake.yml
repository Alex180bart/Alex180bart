name: Gerar animação de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#b9eef7,#67d8ea,#22b8d3,#0891b2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161b22,#0e4f5c,#127a8c,#18a3b8,#22D3EE

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
